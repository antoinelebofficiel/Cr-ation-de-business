<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" fill="none" aria-label="Lorient et 40 km autour">
  <!-- Fond transparent. Schéma du bassin Clartéo. -->
  <g stroke="#f6f2ea" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- Côte atlantique, ouest / sud de Lorient -->
    <path d="M42 78 C58 118 48 158 38 188 C28 228 52 258 78 278 C108 302 128 328 148 352 C178 378 228 392 278 386" opacity="0.55"/>
    <path d="M36 92 C52 128 44 168 34 198" opacity="0.35" stroke-dasharray="3 6"/>
  </g>

  <!-- Disque 40 km -->
  <circle cx="186" cy="208" r="148" stroke="#c4a36a" stroke-width="1.6" fill="rgba(196,163,106,0.06)"/>
  <circle cx="186" cy="208" r="148" stroke="#f6f2ea" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.7"/>

  <!-- Rayons discrets -->
  <g stroke="#c4a36a" stroke-width="0.5" opacity="0.35">
    <line x1="186" y1="208" x2="186" y2="60"/>
    <line x1="186" y1="208" x2="334" y2="208"/>
    <line x1="186" y1="208" x2="186" y2="356"/>
    <line x1="186" y1="208" x2="38" y2="208"/>
  </g>

  <!-- Villes : positions schématiques autour de Lorient -->
  <g fill="#f6f2ea" font-family="Georgia, 'Source Serif 4', serif" font-size="11">
    <!-- Guidel NO -->
    <circle cx="118" cy="132" r="3" fill="#c4a36a"/>
    <text x="128" y="136" fill="#f6f2ea">Guidel</text>
    <!-- Quéven N -->
    <circle cx="168" cy="148" r="3" fill="#c4a36a"/>
    <text x="176" y="144" fill="#f6f2ea">Quéven</text>
    <!-- Hennebont NE -->
    <circle cx="248" cy="154" r="3" fill="#c4a36a"/>
    <text x="256" y="150" fill="#f6f2ea">Hennebont</text>
    <!-- Ploemeur O -->
    <circle cx="128" cy="214" r="3" fill="#c4a36a"/>
    <text x="72" y="218" fill="#f6f2ea" text-anchor="start">Ploemeur</text>
    <!-- Lanester E proche -->
    <circle cx="214" cy="196" r="3" fill="#c4a36a"/>
    <text x="222" y="192" fill="#f6f2ea">Lanester</text>
    <!-- Auray E -->
    <circle cx="318" cy="228" r="3" fill="#c4a36a"/>
    <text x="326" y="232" fill="#f6f2ea">Auray</text>
  </g>

  <!-- Lorient, centre -->
  <circle cx="186" cy="208" r="7" fill="#c4a36a"/>
  <circle cx="186" cy="208" r="11" stroke="#f6f2ea" stroke-width="1.4" fill="none"/>
  <text x="186" y="236" text-anchor="middle" fill="#f6f2ea" font-family="Georgia, 'Source Serif 4', serif" font-size="15" font-weight="600">Lorient</text>

  <!-- Légende rayon -->
  <text x="186" y="56" text-anchor="middle" fill="#c4a36a" font-family="Georgia, 'Source Serif 4', serif" font-size="13" letter-spacing="0.12em">40 km</text>
  <text x="186" y="398" text-anchor="middle" fill="#f6f2ea" font-family="Georgia, 'Source Serif 4', serif" font-size="10" opacity="0.75">aux alentours</text>
</svg>
